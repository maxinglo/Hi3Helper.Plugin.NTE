name: Release NTE Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (three or four numeric components)
        required: true
        type: string
      publish_profile:
        description: NativeAOT publish profile
        required: true
        type: choice
        default: ReleasePublish-O1
        options:
          - ReleasePublish-O1
          - ReleasePublish-O2
          - ReleaseNoReflectionPublish-O1
          - ReleaseNoReflectionPublish-O2
      mirror_existing_release:
        description: Repair the OSS mirror from an existing formal GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nte-release
  cancel-in-progress: false

jobs:
  release:
    if: "!inputs.mirror_existing_release"
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_PROFILE: ${{ inputs.publish_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify both managed configurations
        shell: pwsh
        run: |
          ./scripts/Build.ps1 -Configuration Release
          ./scripts/Build.ps1 -Configuration ReleaseNoReflection
      - name: Publish, verify native ABI and package
        shell: pwsh
        run: ./scripts/Publish.ps1 -Profile $env:PUBLISH_PROFILE -Version $env:RELEASE_VERSION -Package
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-parse "refs/tags/$tag^{}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "The existing $tag tag points to a different commit."
            }
          } elseif ($LASTEXITCODE -ne 1) {
            throw 'Could not check the existing Git tag.'
          }
          $packageName = "NTE_${env:RELEASE_VERSION}_${env:PUBLISH_PROFILE}"
          $package = "artifacts/packages/$packageName.zip"
          gh release create $tag $package --target $env:GITHUB_SHA --title "NTE Plugin $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

  update-feed:
    name: Publish the GitHub auto-update feed
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_PROFILE: ${{ inputs.publish_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish update assets from the released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageName = "NTE_${env:RELEASE_VERSION}_${env:PUBLISH_PROFILE}.zip"
          gh release download "v$env:RELEASE_VERSION" --pattern $packageName --dir artifacts/installer
          if ($LASTEXITCODE -ne 0) { throw 'GitHub installer download failed.' }
          $package = Get-Item -LiteralPath "artifacts/installer/$packageName"
          $extracted = Join-Path $env:GITHUB_WORKSPACE 'artifacts/released-plugin'
          [IO.Compression.ZipFile]::ExtractToDirectory($package.FullName, $extracted)
          ./scripts/New-NteUpdateAssets.ps1 -PublishDirectory $extracted -UpdateDirectory artifacts/update-feed
          ./scripts/Publish-GitHubUpdateFeed.ps1 -Repository $env:GITHUB_REPOSITORY -UpdateDirectory artifacts/update-feed -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA

  mirror:
    name: Mirror the installer and auto-update feed to OSS via ESA
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (needs.release.result == 'success' ||
           (inputs.mirror_existing_release && needs.release.result == 'skipped')) }}
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_PROFILE: ${{ inputs.publish_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and prepare the released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $packageName = "NTE_${env:RELEASE_VERSION}_${env:PUBLISH_PROFILE}.zip"
          $release = gh release view $tag --json isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the formal GitHub Release.' }
          $release = $release | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease -or $release.assets.Count -ne 1 -or $release.assets[0].name -cne $packageName) {
            throw "GitHub Release $tag must have the requested installer as its only asset."
          }
          gh release download $tag --pattern $packageName --dir artifacts/installer
          if ($LASTEXITCODE -ne 0) { throw 'GitHub installer download failed.' }
          $package = Get-Item -LiteralPath "artifacts/installer/$packageName"
          $extracted = Join-Path $env:GITHUB_WORKSPACE 'artifacts/released-plugin'
          [IO.Compression.ZipFile]::ExtractToDirectory($package.FullName, $extracted)
          ./scripts/New-NteUpdateAssets.ps1 -PublishDirectory $extracted -UpdateDirectory artifacts/update-feed
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: 3.5.1
      - name: Add the Alibaba Cloud CLI to the Windows runner path
        shell: pwsh
        run: |
          $cli = Get-Item -LiteralPath 'out/aliyun.exe'
          $cli.DirectoryName >> $env:GITHUB_PATH
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.ALIBABA_CLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALIBABA_CLOUD_OSS_ROLE_ARN }}
      - name: Upload to OSS and verify through ESA
        shell: pwsh
        run: |
          $package = Get-Item -LiteralPath "artifacts/installer/NTE_${env:RELEASE_VERSION}_${env:PUBLISH_PROFILE}.zip"
          ./scripts/Publish-OssMirror.ps1 -Plugin nte -Tag "v$env:RELEASE_VERSION" -Installer $package.FullName -UpdateDirectory artifacts/update-feed
