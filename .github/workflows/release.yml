name: Release NTE Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (three or four numeric components)
        required: true
        type: string
      publish_profile:
        description: NativeAOT publish profile
        required: true
        type: choice
        default: ReleasePublish-O1
        options:
          - ReleasePublish-O1
          - ReleasePublish-O2
          - ReleaseNoReflectionPublish-O1
          - ReleaseNoReflectionPublish-O2

permissions:
  contents: read

concurrency:
  group: nte-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_PROFILE: ${{ inputs.publish_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Verify both managed configurations
        shell: pwsh
        run: |
          ./scripts/Build.ps1 -Configuration Release
          ./scripts/Build.ps1 -Configuration ReleaseNoReflection
      - name: Publish, verify native ABI and package
        shell: pwsh
        run: ./scripts/Publish.ps1 -Profile $env:PUBLISH_PROFILE -Version $env:RELEASE_VERSION -Package -UpdateAssets
      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-parse "refs/tags/$tag^{}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "The existing $tag tag points to a different commit."
            }
          } elseif ($LASTEXITCODE -ne 1) {
            throw 'Could not check the existing Git tag.'
          }
          $packageName = "NTE_${env:RELEASE_VERSION}_${env:PUBLISH_PROFILE}"
          $package = "artifacts/packages/$packageName.zip"
          $updateAssets = @(Get-ChildItem -LiteralPath "artifacts/update/$packageName" -File)
          $files = @($package) + @($updateAssets.FullName)
          # The CLI uploads to a draft and only publishes after every attachment succeeds.
          gh release create $tag @files --target $env:GITHUB_SHA --title "NTE Plugin $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

  mirror:
    name: Mirror release to Gitee
    needs: release
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the published attachments
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$env:RELEASE_VERSION" --dir artifacts/mirror
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release attachment download failed.' }
      - name: Publish the Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $manifest = Get-Item -LiteralPath artifacts/mirror/manifest.json
          $files = @(Get-ChildItem -LiteralPath artifacts/mirror -File | Where-Object Name -ne $manifest.Name | ForEach-Object FullName)
          $files += $manifest.FullName
          ./scripts/Publish-GiteeRelease.ps1 -Repository maxing_long/hi3helper-plugin-nte -Tag "v$env:RELEASE_VERSION" -Commit $env:GITHUB_SHA -Files $files
